services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    x-google-cloudrun:
      ingress-container: true
    environment:
      RAILS_ENV: production
      RAILS8_ENV_LAUNCH_MODE: "Hello! I am running serverless on Google Cloud Run."
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GCS_BUCKET: ${GCS_BUCKET}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-google}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      DATABASE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_QUEUE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_CACHE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_CABLE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DB_POOL: "5"
      IAP_MOCK_EMAIL: ${IAP_MOCK_EMAIL:-ricc@google.com}
    ports:
      - "8080:8080"
    depends_on:
      - cloudsql-proxy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bash", "-c", "until bundle exec rails solid_queue:start; do echo 'SolidQueue: database not ready, retrying in 10s...'; sleep 10; done"]
    environment:
      RAILS_ENV: production
      RAILS8_ENV_LAUNCH_MODE: "Hello! I am running serverless on Google Cloud Run."
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GCS_BUCKET: ${GCS_BUCKET}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-google}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      DATABASE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_QUEUE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_CACHE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DATABASE_CABLE_URL: postgresql://${DB_USER:-rails_user}:${DB_PASSWORD}@cloudsql-proxy:5432/${DB_NAME:-rails_production}
      DB_POOL: "5"
    depends_on:
      - cloudsql-proxy

  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    expose:
      - "5432"
