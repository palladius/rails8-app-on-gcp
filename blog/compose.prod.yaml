# Production blueprint for Cloud Run: web + worker + Cloud SQL Auth Proxy sidecar.
#
# web and worker run the image cloudbuild-image.yaml pushed (BLOG_IMAGE), so nothing is built here.
#
# This file carries NO secret values. Deploying it gives you the three containers on SQLite
# (ephemeral), signed with a throwaway key (SECRET_KEY_BASE_DUMMY). The next command of the codelab
# mounts RAILS_MASTER_KEY and DB_PASSWORD from Secret Manager on web and worker and removes
# SECRET_KEY_BASE_DUMMY; config/database.yml switches to PostgreSQL as soon as DB_PASSWORD is there.
services:
  web:
    # Built and pushed by cloudbuild-image.yaml: compose up deploys it without building.
    image: ${BLOG_IMAGE}
    x-google-cloudrun:
      ingress-container: true
    environment:
      RAILS_ENV: production
      RAILS8_ENV_LAUNCH_MODE: "Hello! I am running serverless on Google Cloud Run."
      GCS_BUCKET: ${GCS_BUCKET}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-google}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_ACCOUNT: ${GOOGLE_CLOUD_ACCOUNT}
      DB_HOST: cloudsql-proxy
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-rails_user}
      DB_NAME: ${DB_NAME:-rails_production}
      SECRET_KEY_BASE_DUMMY: "1"
      DB_POOL: "5"
    ports:
      - "8080:8080"
    depends_on:
      - cloudsql-proxy

  worker:
    image: ${BLOG_IMAGE}
    command: ["bash", "-c", "until bundle exec rails solid_queue:start; do echo 'SolidQueue: database not ready, retrying in 10s...'; sleep 10; done"]
    environment:
      RAILS_ENV: production
      RAILS8_ENV_LAUNCH_MODE: "Hello! I am running serverless on Google Cloud Run."
      GCS_BUCKET: ${GCS_BUCKET}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-google}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_ACCOUNT: ${GOOGLE_CLOUD_ACCOUNT}
      DB_HOST: cloudsql-proxy
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-rails_user}
      DB_NAME: ${DB_NAME:-rails_production}
      SECRET_KEY_BASE_DUMMY: "1"
      DB_POOL: "5"
    depends_on:
      - cloudsql-proxy

  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    expose:
      - "5432"
