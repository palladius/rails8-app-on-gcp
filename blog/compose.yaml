services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -p 3000 -b '0.0.0.0'"
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/blog_development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec rails solid_queue:start
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/blog_development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 📧 Email Catcher: Catches all outgoing emails (admin signup, reset password)
  # Web UI: http://localhost:8025 | SMTP port: 1025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  # 🗄️ Database GUI Admin: In-browser DB management for PostgreSQL
  # Web UI: http://localhost:8081
  db-admin:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
