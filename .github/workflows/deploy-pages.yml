name: Deploy Workshop to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'  # Pinned per docs/CONSTITUTION.md §7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          gem install kramdown kramdown-parser-gfm
          npm install -g @marp-team/marp-cli

      - name: Build Presentation Slides
        run: |
          mkdir -p slides/dist
          marp slides/index.md -o slides/dist/index.html --html

      - name: Build Workshop Sites
        run: |
          cd workshop
          
          # Build the Static HTML (Google Codelab style + Root Landing Portal + Slides)
          ruby visualizer/build_ghpages.rb
          
          # Assemble the deployment directory
          cd ..
          mkdir -p dist
          
          # Deploy the official Google Codelab workshop at root
          cp -r workshop/build/* dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
