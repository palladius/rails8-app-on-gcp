# Publishes the public workshop seed: ghcr.io/<owner>/rails8-blog-seed:{gems,gems-lock-<hash>,buildcache}.
# Attendees pass it as _WORKSHOP_SEED so their project's first Cloud Build does not compile every gem.
# Pushes no app image. Runbook (first run, making the package public): workshop/SEED_IMAGE.md.
# A new app started from this repository deletes this file; its own project seed needs none of it.
name: Workshop gem seed

on:
  push:
    branches: ["main"]
    paths:
      - "blog/Gemfile"
      - "blog/Gemfile.lock"
      - "blog/Dockerfile"
      - ".ruby-version"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two pushes to main in a row must not race on :gems.
concurrency:
  group: "workshop-seed"
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same script as Cloud Build: seeded from its own :gems, cache exported to its own :buildcache.
      # No app tags, so the app image only fills the cache. linux/amd64 only: Cloud Build is the one
      # consumer, and a plain local `docker build` never reads a seed (workshop/SEED_IMAGE.md).
      - name: Build and push the seed
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          # ghcr.io repository names must be lowercase
          SEED_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rails8-blog-seed"
          LOCK_HASH="$(sha256sum blog/Gemfile.lock | cut -c1-12)"
          # The source label links the ghcr.io package to this repository
          SEED_EXTRA_TAGS="gems-lock-$LOCK_HASH" \
            bash blog/bin/cloudbuild-build-image "$SEED_REPO" blog -- --platform linux/amd64 \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo "### 🌱 $SEED_REPO:gems-lock-$LOCK_HASH" >> "$GITHUB_STEP_SUMMARY"
