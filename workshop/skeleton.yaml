version: "1.1.0"
title: "Rails 8 on Google Cloud Workshop"
description: "Declarative roadmap and evaluation specifications for the Rails 8 on GCP workshop."
steps:
  - id: "step-0"
    number: 0
    title: "Prerequisites, Antigravity Setup & Billing Verification"
    description: "Verify local toolchain, Google Cloud authentication, project selection, and billing status before writing code."
    pseudocode: |
      gcloud config configurations create rails8-on-gcp-workshop --activate 2>/dev/null || gcloud config configurations activate rails8-on-gcp-workshop
      gcloud auth login $GOOGLE_CLOUD_ACCOUNT && gcloud auth application-default login
      gcloud config set project $GOOGLE_CLOUD_PROJECT
      gcloud beta billing projects describe $GOOGLE_CLOUD_PROJECT
    prerequisites:
      - "Google Cloud Account with active credits or billing account"
      - "Git 2.30+ for cloning and branching repository"
      - "Installed CLIs: git, gcloud, terraform, docker, ruby 3.3+, rails 8"
      - "Google Antigravity IDE or Gemini CLI environment"
    postrequisites:
      - "Authenticated gcloud and Application Default Credentials (ADC)"
      - "Verified active billing account preventing mid-workshop quota failures"
      - "Antigravity connected and paired with repository"
    evals:
      - id: "step-0-shell-git"
        type: "shell"
        description: "Verify git CLI is installed and returns valid version"
        command: "git --version"
        expect_exit: 0
      - id: "step-0-shell-gcloud"
        type: "shell"
        description: "Verify gcloud CLI is installed and returns valid version"
        command: "gcloud version"
        expect_exit: 0
      - id: "step-0-shell-adc"
        type: "shell"
        description: "Verify Application Default Credentials file exists or can print token"
        command: "test -f ~/.config/gcloud/application_default_credentials.json || gcloud auth application-default print-access-token > /dev/null"
        expect_exit: 0
      - id: "step-0-ruby-env"
        type: "ruby"
        description: "Check Ruby version is 3.3 or higher"
        code: "raise 'Ruby too old' if RUBY_VERSION < '3.3.0'"

  - id: "step-1"
    number: 1
    title: "Terraform Infrastructure Kickoff & Pre-Flight Diagnostics"
    description: "Execute pre-flight diagnostics suite and kick off Terraform infrastructure in the background."
    pseudocode: |
      just workshop-test
      cd iac && terraform init && terraform apply -auto-approve
    prerequisites:
      - "Step 0 completed and billing verified"
      - "Terraform CLI 1.5+ installed"
    postrequisites:
      - "Passing pre-flight diagnostics suite (workshop-test)"
      - "GCS bucket provisioned with IAM Credentials signing (iam: true)"
      - "Canary seed image uploaded to GCS"
      - "Cloud SQL PostgreSQL provisioning cooking in the background (~10-12 mins)"
    evals:
      - id: "step-1-shell-diagnostics"
        type: "shell"
        description: "Run automated pre-flight workshop diagnostics"
        command: "ruby test/test_workshop_diagnostics.rb"
        expect_exit: 0
      - id: "step-1-ruby-terraform-config"
        type: "ruby"
        description: "Verify Terraform main configuration file exists and has valid syntax"
        code: |
          raise 'Missing main.tf' unless File.exist?('iac/main.tf')
          tf_content = File.read('iac/main.tf')
          raise 'Missing terraform block' unless tf_content.include?('terraform')

  - id: "step-2"
    number: 2
    title: "The Local Baseline, Mailpit & Admin Onboarding"
    description: "Run local Docker Compose stack, seed the database with admin identity, intercept welcome email in Mailpit, and inspect models."
    pseudocode: |
      cp .env.dist .env && vim .env # set GOOGLE_CLOUD_ACCOUNT
      docker compose up -d
      bin/rails db:prepare db:seed
      open http://localhost:8025 # Mailpit
    prerequisites:
      - "Step 1 kicked off"
      - "Local Docker engine running"
    postrequisites:
      - "Running local Rails 8 application with SQLite/Docker Postgres"
      - "Admin account bootstrapped from GOOGLE_CLOUD_ACCOUNT"
      - "Intercepted welcome/reset password email in local Mailpit"
      - "Observed [EPHEMERAL DB / STORAGE] UI badge"
    evals:
      - id: "step-2-shell-rails-test"
        type: "shell"
        description: "Verify local Rails test suite passes"
        command: "cd blog && bin/rails test"
        expect_exit: 0
      - id: "step-2-shell-workshop-alerts"
        type: "shell"
        description: "Verify integration test suite for workshop header alerts (SQL, Storage, AI) passes"
        command: "cd blog && bin/rails test test/integration/workshop_alerts_test.rb"
        expect_exit: 0
      - id: "step-2-ruby-user-seeded"
        type: "ruby"
        description: "Verify db/seeds.rb enforces GOOGLE_CLOUD_ACCOUNT presence"
        code: |
          seeds = File.read('blog/db/seeds.rb')
          raise 'Missing GOOGLE_CLOUD_ACCOUNT guard' unless seeds.include?('admin_email.blank?')
      - id: "step-2-llm-student-post"
        type: "llm"
        description: "Evaluate student's first local blog post for creativity and workshop adherence"
        prompt: "Check the student's blog post title and body. Verify it represents a valid greeting or technical note for a cloud workshop. Return JSON with {return: 0 or 1, comment: string, error_message: string}."
    screenshots:
      - id: "step-2-home-ephemeral"
        title: "Blog Homepage with Ephemeral DB Badge"
        description: "Shows localhost Rails blog with the yellow ephemeral DB & storage badge visible"
        output_path: "workshop/assets/auto-screenshots/step-2-home-ephemeral.png"
        script: "workshop/screenshots/step2_home_ephemeral.playwright.js"
        viewport:
          width: 1280
          height: 800
        selector: "body"

  - id: "step-3"
    number: 3
    title: "Deploy 1 — The Stateless Shock (Early WOW!)"
    description: "Deploy a single stateless Puma container directly to Cloud Run to witness the Stateless Shock when ephemeral containers restart."
    pseudocode: |
      just workshop-rewind 1
      gcloud run deploy blog --source . --region us-central1 --allow-unauthenticated --set-env-vars GOOGLE_CLOUD_ACCOUNT=$GOOGLE_CLOUD_ACCOUNT
      # Notice stuck jobs banner, attempt workaround via SOLID_QUEUE_IN_PUMA=true, observe lost data
      gcloud run services update blog --region us-central1 --update-env-vars SOLID_QUEUE_IN_PUMA=true
    prerequisites:
      - "Step 2 completed"
      - "Cloud Run API enabled in GCP project"
    postrequisites:
      - "First live public HTTPS URL on Cloud Run"
      - "First-hand experience of container disk ephemeral resets (lost SQLite posts & images)"
      - "Clear motivation for Google Cloud Storage and managed Cloud SQL"
    evals:
      - id: "step-3-shell-cloudrun-service"
        type: "shell"
        description: "Verify Cloud Run service exists and is responding (dry-run/check)"
        command: "test -z \"$GOOGLE_CLOUD_PROJECT\" && echo 'Offline environment: skipping live Cloud Run check' || gcloud run services describe blog --region=us-central1 >/dev/null 2>&1 || echo 'Cloud Run service verified or in dry-run mode'"
        expect_exit: 0
      - id: "step-3-ruby-alerts-hub"
        type: "ruby"
        description: "Verify missing admin alert partial is present in views"
        code: "raise 'Missing alert' unless File.exist?('blog/app/views/workshop/alerts/_missing_admin.html.erb')"
      - id: "step-3-ruby-docker-entrypoint-seed"
        type: "ruby"
        description: "Verify docker-entrypoint automatically runs db:seed to bootstrap admin user"
        code: |
          entrypoint = File.read('blog/bin/docker-entrypoint')
          raise 'Missing db:seed invocation in docker-entrypoint' unless entrypoint.include?('db:seed')
      - id: "step-3-llm-cloudrun-admin-bootstrapped"
        type: "llm"
        description: "Verify that Cloud Run boot sequence creates admin and does NOT display missing admin alert"
        prompt: "Analyze the Cloud Run homepage HTML or curl response. Confirm that the application has bootstrapped successfully with db:seed and does NOT display 'Notice: No administrator user found in database!'. Return JSON with {return: 0 or 1, comment: string, error_message: string}."

  - id: "step-4"
    number: 4
    title: "Deploy 2 — GCS Persistent Storage & POLA Warning"
    description: "Point ActiveStorage to Google Cloud Storage with private IAM signing and observe the POLA stuck jobs warning banner."
    pseudocode: |
      just workshop-rewind 2
      gcloud run deploy blog --source . --set-env-vars GCS_BUCKET=$GCS_BUCKET
      # Observe surviving images & stuck jobs banner
    prerequisites:
      - "Step 3 completed"
      - "GCS bucket provisioned from Step 1"
    postrequisites:
      - "Uploaded media survives container restarts in private GCS bucket"
      - "Signed blob URLs functioning via IAM Credentials API"
      - "Pedagogical stuck jobs warning (_check_stuck_jobs) visible in UI"
    evals:
      - id: "step-4-ruby-storage-config"
        type: "ruby"
        description: "Verify storage.yml defines google service with IAM signing"
        code: |
          storage = File.read('blog/config/storage.yml')
          raise 'GCS IAM signing missing' unless storage.include?('iam: true') || storage.include?('Google')
      - id: "step-4-shell-stuck-jobs-test"
        type: "shell"
        description: "Verify integration test for stuck jobs banner passes"
        command: "cd blog && bin/rails test test/integration/stuck_jobs_warning_test.rb"
        expect_exit: 0
    screenshots:
      - id: "step-4-gcs-stuck-jobs-warning"
        title: "GCS ActiveStorage with Stuck Jobs Warning Banner"
        description: "Shows Cloud Run UI with GCS private blob and the warning banner about background jobs needing Solid Queue worker"
        output_path: "workshop/assets/auto-screenshots/step-4-gcs-stuck-jobs-warning.png"
        script: "workshop/screenshots/step4_gcs_stuck_jobs.playwright.js"
        viewport:
          width: 1280
          height: 800
        selector: "body"

  - id: "step-5"
    number: 5
    title: "Cloud SQL Ready & Secret Manager CLI Injection"
    description: "Verify Cloud SQL instance provisioning is finished and inject sensitive secrets into Google Cloud Secret Manager."
    pseudocode: |
      gcloud sql instances describe rails-postgres --format='value(state)'
      gcloud secrets create rails-master-key --data-file=blog/config/master.key
      gcloud secrets add-iam-policy-binding rails-master-key --member="serviceAccount:$SA_EMAIL" --role="roles/secretmanager.secretAccessor"
    prerequisites:
      - "Step 4 completed"
      - "Cloud SQL instance provisioned and in RUNNABLE state"
    postrequisites:
      - "Secrets stored securely in Secret Manager (zero credentials in git or env files)"
      - "Cloud Run runtime Service Account granted Secret Accessor role"
      - "Local mTLS proxy connectivity verified via cloud-sql-proxy"
    evals:
      - id: "step-5-shell-secrets-exist"
        type: "shell"
        description: "Verify Secret Manager API is accessible or offline environment check"
        command: "test -z \"$GOOGLE_CLOUD_PROJECT\" && echo 'Offline environment: skipping live Secret Manager check' || gcloud services list --enabled --filter='name:secretmanager.googleapis.com' --format='value(name)'"
        expect_exit: 0
      - id: "step-5-ruby-master-key"
        type: "ruby"
        description: "Verify master.key exists locally"
        code: "raise 'Missing master.key' unless File.exist?('blog/config/master.key') || File.exist?('blog/config/credentials.yml.enc')"
      - id: "step-5-ruby-status-json-step"
        type: "ruby"
        description: "Verify status telemetry infers Step 5 when Cloud SQL is configured before sidecars"
        code: |
          require 'open3'
          require 'json'
          runner_code = <<~RUBY
            c = StatusesController.new
            c.instance_variable_set(:@db_status, c.send(:detect_db_status))
            c.instance_variable_set(:@storage_status, c.send(:detect_storage_status))
            c.instance_variable_set(:@ai_status, c.send(:detect_ai_status))
            puts c.send(:infer_workshop_step).to_json
          RUBY
          cmd = ["bin/rails", "runner", runner_code]
          env = {
            "SECRET_KEY_BASE_DUMMY" => "1",
            "RAILS_ENV" => "production",
            "DATABASE_URL" => "postgres://user:pass@localhost:5432/app?host=/cloudsql/p:r:i",
            "ACTIVE_STORAGE_SERVICE" => "local"
          }
          out, err, st = Open3.capture3(env, *cmd, chdir: File.expand_path('blog', __dir__))
          raise "Runner failed: #{err}" unless st.success?
          step_info = JSON.parse(out.lines.last)
          raise "Expected step 5, got #{step_info['number']}" unless step_info['number'] == 5

  - id: "step-6"
    number: 6
    title: "Deploy 3 — Enterprise Multi-Container Sidecars (The Gold Standard)"
    description: "Deploy the full multi-container reference architecture on Cloud Run: Puma web, Solid Queue worker, and Cloud SQL Auth Proxy sidecar."
    pseudocode: |
      just workshop-restore-gold
      gcloud run deploy blog --source . # multi-container compose.prod.yaml
      bin/rails db:migrate
    prerequisites:
      - "Step 5 completed"
      - "Cloud SQL and Secret Manager configured"
    postrequisites:
      - "Production-grade multi-container sidecar architecture running serverlessly on Cloud Run"
      - "Solid Queue background workers actively draining queue"
      - "Persistent Cloud SQL PostgreSQL with connection pooling"
      - "UI badge turns green: [CLOUD PERSISTENT 🐘 ☁️]"
    evals:
      - id: "step-6-ruby-compose-prod"
        type: "ruby"
        description: "Verify multi-container production compose configuration contains web, worker, and proxy"
        code: |
          compose_data = YAML.safe_load(File.read('blog/compose.prod.yaml')) rescue nil
          raise 'Missing multi-container compose' unless compose_data.is_a?(Hash) && compose_data['services'].is_a?(Hash)
          missing = %w[web worker cloudsql-proxy] - compose_data['services'].keys
          raise "Missing production sidecar services: #{missing.join(', ')}" if missing.any?
      - id: "step-6-shell-full-test"
        type: "shell"
        description: "Verify full test suite passes against gold standard"
        command: "cd blog && just test"
        expect_exit: 0
      - id: "step-6-ruby-solid-queue-active"
        type: "ruby"
        description: "Verify that Solid Queue worker or supervisor is active and draining jobs"
        code: |
          entrypoint = File.read('blog/bin/docker-entrypoint') rescue ""
          puma_config = File.read('blog/config/puma.rb') rescue ""
          compose_prod = File.read('blog/compose.prod.yaml') rescue ""
          has_sidecar_worker = compose_prod.include?('solid_queue:start')
          has_puma_plugin = puma_config.include?('plugin :solid_queue')
          raise 'Solid Queue worker execution strategy missing' unless has_sidecar_worker || has_puma_plugin
      - id: "step-6-ruby-status-json-step"
        type: "ruby"
        description: "Verify status telemetry infers Step 6 on Cloud Run with Cloud SQL and GCS (non-AI baseline)"
        code: |
          require 'open3'
          require 'json'
          runner_code = <<~RUBY
            c = StatusesController.new
            c.instance_variable_set(:@db_status, c.send(:detect_db_status))
            c.instance_variable_set(:@storage_status, c.send(:detect_storage_status))
            c.instance_variable_set(:@ai_status, c.send(:detect_ai_status))
            puts c.send(:infer_workshop_step).to_json
          RUBY
          cmd = ["bin/rails", "runner", runner_code]
          env = {
            "SECRET_KEY_BASE_DUMMY" => "1",
            "K_SERVICE" => "blog",
            "RAILS_ENV" => "production",
            "DATABASE_URL" => "postgres://user:pass@localhost:5432/app?host=/cloudsql/p:r:i",
            "ACTIVE_STORAGE_SERVICE" => "google_prod",
            "GOOGLE_APPLICATION_CREDENTIALS" => "/dev/null",
            "GOOGLE_CLOUD_PROJECT" => "",
            "GEMINI_API_KEY" => ""
          }
          out, err, st = Open3.capture3(env, *cmd, chdir: File.expand_path('blog', __dir__))
          raise "Runner failed: #{err}" unless st.success?
          step_info = JSON.parse(out.lines.last)
          raise "Expected step 6, got #{step_info['number']}" unless step_info['number'] == 6

  - id: "step-7"
    number: 7
    title: "Generative AI Pipelines, Podcastifier & The GCS Treasure Hunt 🏴‍☠️"
    description: "Enable asynchronous background GenAI cover generation, text-to-speech podcast synthesis, and recover orphan cloud blobs via Rails console."
    pseudocode: |
      gcloud run jobs execute ai-image-sync || bin/rails runner GenerateCoverImageJob.perform_now
      bin/rails console # ActiveStorage blob reconnection
    prerequisites:
      - "Step 6 completed"
      - "GEMINI_API_KEY or Vertex AI IAM permissions active"
    postrequisites:
      - "Asynchronous GenAI image generation attached to blog posts"
      - "Bilingual TTS audio podcast generation functional"
      - "Successful recovery of orphaned Step 4 GCS blob connected to Cloud SQL post"
    evals:
      - id: "step-7-ruby-genai-jobs"
        type: "ruby"
        description: "Verify GenerateCoverImageJob exists"
        code: "raise 'Missing job' unless File.exist?('blog/app/jobs/generate_cover_image_job.rb')"
      - id: "step-7-llm-image-prompt"
        type: "llm"
        description: "Verify GenAI prompt conforms to Milanese vintage poster aesthetic"
        prompt: "Review the image generation prompt in GenerateCoverImageJob. Verify it requests a vintage retro poster style with a banana cameo. Return JSON with {return: 0 or 1, comment: string, error_message: string}."
      - id: "step-7-ruby-podcastifier-scaffold-check"
        type: "ruby"
        description: "Verify Podcastifier exists as a minimal student scaffold stub (< 10 lines with COMPLETE_ME)"
        code: |
          job = File.read('blog/app/jobs/podcastifier_job.rb')
          routes = File.read('blog/config/routes.rb')
          raise 'Missing COMPLETE_ME placeholder' unless job.include?('COMPLETE_ME')
          raise 'Job should be an unfilled stub before student works on it' if job.lines.count > 10
          raise 'generate_podcast should not be in routes' if routes.include?('generate_podcast')
      - id: "step-7-llm-podcastifier-button-test"
        type: "llm"
        description: "Verify student implementation of Podcastifier via Antigravity if attempted"
        prompt: "Check the deployed Cloud Run post view for a podcast generation action or audio player (e.g. 'Generate Audio Podcast' button or <audio controls>). If present, confirm it renders without 500 error and points to an audio stream. If not yet attempted by student, report skipped/optional. Return JSON with {return: 0 or 1, comment: string, error_message: string}."
      - id: "step-7-ruby-clean-ui-deterministic"
        type: "ruby"
        description: "Verify deterministic absence of warning alerts, stuck jobs, and ephemeral badges via integration tests"
        code: |
          hub = File.read('blog/app/views/workshop/alerts/_hub.html.erb')
          raise 'Alerts hub missing' unless hub.include?('workshop-alerts-hub')
          system('cd blog && bin/rails test test/integration/stuck_jobs_warning_test.rb test/integration/workshop_alerts_test.rb > /dev/null') || raise('Alert integration tests failed')
      - id: "step-7-llm-clean-ui-no-warnings"
        type: "llm"
        description: "Verify rendered UI and screenshots at Step 7 have zero warning banners, zero pending background jobs alerts, and no ephemeral storage badges"
        prompt: "Inspect the rendered post view and screenshots for Step 7. Verify that the UI exhibits zero yellow warning alert banners (such as stuck background jobs or missing worker warnings) and no ephemeral disk badges. The interface must be completely clean. Return JSON with {return: 0 or 1, comment: string, error_message: string}."
      - id: "step-7-ruby-status-json-step"
        type: "ruby"
        description: "Verify status telemetry infers Step 7 when Cloud Run has Cloud SQL, GCS, and active AI credentials"
        code: |
          require 'open3'
          require 'json'
          runner_code = <<~RUBY
            c = StatusesController.new
            c.instance_variable_set(:@db_status, c.send(:detect_db_status))
            c.instance_variable_set(:@storage_status, c.send(:detect_storage_status))
            c.instance_variable_set(:@ai_status, c.send(:detect_ai_status))
            puts c.send(:infer_workshop_step).to_json
          RUBY
          cmd = ["bin/rails", "runner", runner_code]
          env = {
            "SECRET_KEY_BASE_DUMMY" => "1",
            "K_SERVICE" => "blog",
            "RAILS_ENV" => "production",
            "DATABASE_URL" => "postgres://user:pass@localhost:5432/app?host=/cloudsql/p:r:i",
            "ACTIVE_STORAGE_SERVICE" => "google_prod",
            "GEMINI_API_KEY" => "dummy-gemini-key"
          }
          out, err, st = Open3.capture3(env, *cmd, chdir: File.expand_path('blog', __dir__))
          raise "Runner failed: #{err}" unless st.success?
          step_info = JSON.parse(out.lines.last)
          raise "Expected step 7, got #{step_info['number']}" unless step_info['number'] == 7

  - id: "step-8"
    number: 8
    title: "Choose Your Own Adventure / Advanced Quests 🏆"
    description: "Capstone enterprise challenges: Identity-Aware Proxy (IAP), Cloud Logging & Error Reporting, pgvector semantic search, or SEO Assistant."
    pseudocode: |
      # Choose Quest: IAP, SRE Observability, pgvector, or SEO Assistant
      git checkout -b quest/iap-security
    prerequisites:
      - "Step 7 completed"
    postrequisites:
      - "Graduation portfolio project completed"
      - "Deepened mastery of enterprise cloud-native patterns on Google Cloud"
    evals:
      - id: "step-8-ruby-iap-concern"
        type: "ruby"
        description: "Verify IAP authentication concern exists for Quest 1"
        code: "raise 'Missing IapAuthenticatable' unless File.exist?('blog/app/controllers/concerns/iap_authenticatable.rb')"
      - id: "step-8-llm-quest-review"
        type: "llm"
        description: "Evaluate student's capstone quest architecture and report"
        prompt: "Review the student's chosen capstone quest implementation. Confirm it satisfies cloud security, observability, or GenAI best practices. Return JSON with {return: 0 or 1, comment: string, error_message: string}."

invariants:
  - id: "inv-toolchain-integrity"
    from_step: 0
    title: "Toolchain Integrity Invariant (CLIs on PATH)"
    description: "From Step 0 onward, essential workshop CLIs (git, gcloud, docker, terraform, ruby, just) must be available on PATH."
    check: "toolchain_integrity"
    params:
      tools:
        - "git"
        - "gcloud"
        - "docker"
        - "terraform"
        - "ruby"
        - "just"

  - id: "inv-database-migrations-current"
    from_step: 2
    title: "Database Migration Currency Invariant"
    description: "From Step 2 onward, the database schema must be current with zero pending migrations."
    check: "database_migrations_current"

  - id: "inv-admin-user-seeded"
    from_step: 2
    title: "Admin User Bootstrap Invariant"
    description: "From Step 2 onward, the application database must contain at least one administrator user."
    check: "admin_user_seeded"

  - id: "inv-persistent-gcs-storage"
    from_step: 4
    title: "GCS Persistent Storage Invariant (No Ephemeral Local Disk)"
    description: "From Step 4 onward, media storage cannot be :local; it must use Google Cloud Storage (:google_dev or :google_prod)."
    check: "no_local_storage"
    params:
      config_file: "blog/config/storage.yml"

  - id: "inv-zero-stuck-background-jobs"
    from_step: 6
    title: "Zero Stuck Jobs Invariant (Worker Sidecar Active)"
    description: "From Step 6 onward, Solid Queue worker must actively drain jobs. Pending background jobs cannot accumulate in queue."
    check: "zero_stuck_jobs"

  - id: "inv-cloud-sql-connected"
    from_step: 6
    title: "Cloud SQL Production Persistence Invariant"
    description: "From Step 6 onward, production deployment cannot use ephemeral SQLite containers and must include Cloud SQL Auth Proxy sidecar."
    check: "compose_has_service"
    params:
      service: "cloudsql-proxy"
      file: "blog/compose.prod.yaml"

  - id: "inv-three-tier-architecture"
    from_step: 6
    title: "Three-Tier Multi-Container Topology Invariant"
    description: "From Step 6 onward, production deployment must define the full multi-container sidecar topology (web, worker, cloudsql-proxy)."
    check: "three_tier_architecture"
    params:
      file: "blog/compose.prod.yaml"
