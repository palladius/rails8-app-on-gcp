services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    x-google-cloudrun:
      ingress-container: true
      min-instances: 1
      startup-probe:
        http-get:
          path: /up
          port: 8080
        period-seconds: 10
        timeout-seconds: 5
        failure-threshold: 30
        initial-delay-seconds: 5
    environment:
      RAILS_ENV: production
      HTTP_PORT: "8080"
      TARGET_PORT: "3000"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_CACHE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_QUEUE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_CABLE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DB_POOL: "5"
    ports:
      - "8080:8080"
    depends_on:
      - cloudsql-proxy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bash", "-c", "until bundle exec rails solid_queue:start; do echo 'SolidQueue: tables not ready, retrying in 10s...'; sleep 10; done"]
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_CACHE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_QUEUE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DATABASE_CABLE_URL: postgresql://rails:${DB_PASSWORD}@cloudsql-proxy:5432/rails8_turbo_chat_production
      DB_POOL: "5"
    depends_on:
      - cloudsql-proxy

  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    expose:
      - "5432"

