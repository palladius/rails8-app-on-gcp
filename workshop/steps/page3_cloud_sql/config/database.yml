# SQLite for local development, PostgreSQL for Cloud Run.
# The DATABASE_URL env var (if set) takes precedence over any adapter config.
#
# Local dev:  sqlite3 (no setup needed)
# Cloud Run:  postgres via DATABASE_URL env var pointing to Cloud SQL

default: &default
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3

# Production uses DATABASE_URL (PostgreSQL on Cloud SQL) if available,
# otherwise falls back to SQLite for local/docker testing.
production:
  primary:
    <<: *default
    adapter: <%= ENV['DATABASE_URL'].present? ? 'postgresql' : 'sqlite3' %>
    url: <%= ENV['DATABASE_URL'] %>
    database: <%= ENV['DATABASE_URL'].present? ? nil : 'storage/production.sqlite3' %>
  cache:
    <<: *default
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
