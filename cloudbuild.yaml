###############################################################################
# Cloud Build for rails8-app-on-gcp
#
# Two-stage pattern (adapted from rails8-turbo-chat):
#   Stage 1: bin/cloudbuild-submit (local) — sources .env, assembles substitutions
#   Stage 2: THIS FILE (Cloud Build) — builds, tags, pushes, deploys
#
# Layer cache: every Cloud Build runs on a fresh VM, so the only cache that
# survives is one stored in Artifact Registry. A plain `--cache-from :latest`
# never hits: BuildKit needs cache metadata, and the final image does not hold
# the `build` stage where `bundle install` runs. `mode=max` exports every stage
# to `rails8-blog:buildcache`, so a change outside Gemfile/Gemfile.lock reuses
# the installed gems. Measurements: https://github.com/palladius/rails8-app-on-gcp/issues/217
# (slow codelab builds).
#
# Substitutions are passed by:
#   - bin/cloudbuild-submit (local testing)
#   - Cloud Build Trigger (auto-deploy, configured in Terraform)
###############################################################################

timeout: 1800s  # 30min
options:
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_REGION: europe-west1
  _APP_NAME: blog
  _AR_REPO: rails8-gcp-app
  _ENVIRONMENT: dev
  _CLOUD_SQL_CONNECTION: ''
  _ENABLE_SIGNUP: 'true'

steps:
  # 0. A BuildKit builder that can import and export a registry cache (the default
  #    docker driver cannot export `mode=max`). The image comes from Google's Docker
  #    Hub mirror to stay clear of Docker Hub rate limits on shared build IPs.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'buildx-builder'
    args:
      - 'buildx'
      - 'create'
      - '--name=cached'
      - '--driver=docker-container'
      - '--driver-opt=image=mirror.gcr.io/moby/buildkit:buildx-stable-1'
      - '--use'
      - '--bootstrap'

  # 1. Build blog/ with the registry cache, tag (latest, sha, version) and push in one go.
  #    buildx pushes straight from its builder, so there is no `images:` section.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build-push'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SHORT_SHA="$SHORT_SHA"  # substitution: empty on a manual submit
        SHORT_SHA="$${SHORT_SHA:-local}"
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/rails8-blog"
        TAGS=(-t "$$IMAGE:latest" -t "$$IMAGE:sha-$$SHORT_SHA")
        if [ -f VERSION ]; then TAGS+=(-t "$$IMAGE:v$$(cat VERSION)"); fi

        docker buildx build --builder cached --progress=plain \
          --cache-from "type=registry,ref=$$IMAGE:buildcache" \
          --cache-to "type=registry,ref=$$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
          "$${TAGS[@]}" --push blog/

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-cloudrun'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        APP_VERSION=$$(cat VERSION 2>/dev/null || echo 'unknown')
        SHORT_SHA="$SHORT_SHA"  # substitution: empty on a manual submit
        SHORT_SHA="$${SHORT_SHA:-local}"
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/rails8-blog:v$$APP_VERSION"

        echo "🚀 Deploying $$IMAGE to ${_APP_NAME}"
        echo "   Environment: ${_ENVIRONMENT}"

        gcloud run deploy "${_APP_NAME}" \
          --project "$PROJECT_ID" \
          --image "$$IMAGE" \
          --platform managed \
          --region "${_AR_REGION}" \
          --port 8080 \
          --memory "1Gi" \
          --add-cloudsql-instances="${_CLOUD_SQL_CONNECTION}" \
          --service-account="rails-cloudrun-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --update-env-vars="RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,RAILS_LOG_TO_STDOUT=yesplease,APP_VERSION=$$APP_VERSION,GIT_SHORT_SHA=$$SHORT_SHA,RUBY_YJIT_ENABLE=true,ENABLE_GCP=true,ENABLE_SIGNUP=${_ENABLE_SIGNUP},ENVIRONMENT=${_ENVIRONMENT},GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
          --allow-unauthenticated

        echo "✅ Deployed to Cloud Run: ${_APP_NAME}"

