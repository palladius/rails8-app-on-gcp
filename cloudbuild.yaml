steps:
  # 1. Build the Docker image from the blog/ directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:$COMMIT_SHA'
      - '-t'
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:latest'
      - './blog'

  # 2. Extract VERSION and tag image with semver
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f "VERSION" ]; then
          VERSION=$$(cat VERSION)
          docker tag ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:$COMMIT_SHA \
                     ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:v$$VERSION
        fi

  # 3. Push all tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog'

  # 4. Deploy to Cloud Run (PR=ephemeral, main=DEV+PROD)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$$_PR_NUMBER" ]; then
          echo "🚀 Deploying ephemeral PR environment for PR #$$_PR_NUMBER"
          gcloud run deploy ${_APP_NAME}-pr-$$_PR_NUMBER \
            --image ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:$COMMIT_SHA \
            --region ${_AR_REGION} \
            --allow-unauthenticated
        else
          echo "🚀 Deploying to DEV environment"
          gcloud run deploy ${_APP_NAME}-dev \
            --image ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:$COMMIT_SHA \
            --region ${_AR_REGION} \
            --allow-unauthenticated

          # TODO: Add integration/smoke tests before promoting to prod

          echo "🚀 Deploying to PROD environment"
          gcloud run deploy ${_APP_NAME}-prod \
            --image ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog:$COMMIT_SHA \
            --region ${_AR_REGION} \
            --allow-unauthenticated
        fi

substitutions:
  _AR_REGION: europe-west1
  _APP_NAME: palladius-genai-rails-app

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rails8-gcp-app/rails8-blog'
