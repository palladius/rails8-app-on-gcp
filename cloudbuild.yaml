###############################################################################
# Cloud Build for rails8-app-on-gcp
#
# Two-stage pattern (adapted from rails8-turbo-chat):
#   Stage 1: bin/cloudbuild-submit (local) — sources .env, assembles substitutions
#   Stage 2: THIS FILE (Cloud Build) — builds, tags, pushes, deploys
#
# Substitutions are passed by:
#   - bin/cloudbuild-submit (local testing)
#   - Cloud Build Trigger (auto-deploy, configured in Terraform)
###############################################################################

timeout: 1800s  # 30min
options:
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_REGION: europe-west1
  _APP_NAME: palladius-genai-rails-app
  _AR_REPO: rails8-gcp-app
  _ENVIRONMENT: dev
  _RAILS_MASTER_KEY: ''
  _DATABASE_URL: ''
  _CLOUD_SQL_CONNECTION: ''
  _ENABLE_SIGNUP: 'true'

images:
  - '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rails8-blog:latest'

steps:
  # 1. Build Docker image from blog/ directory
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args:
      - 'build'
      - '-t'
      - '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rails8-blog:latest'
      - 'blog/'

  # 2. Tag with SHA and VERSION
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-tag'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SHORT_SHA="$${SHORT_SHA:-$${COMMIT_SHA:0:7}}"
        SHORT_SHA="$${SHORT_SHA:-local}"
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/rails8-blog"

        docker tag "$$IMAGE:latest" "$$IMAGE:sha-$$SHORT_SHA"

        if [ -f "VERSION" ]; then
          VERSION=$$(cat VERSION)
          docker tag "$$IMAGE:latest" "$$IMAGE:v$$VERSION"
          echo "✅ Tagged: latest, sha-$$SHORT_SHA, v$$VERSION"
        else
          echo "✅ Tagged: latest, sha-$$SHORT_SHA"
        fi

  # 3. Push all tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    args:
      - 'push'
      - '--all-tags'
      - '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rails8-blog'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-cloudrun'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        APP_VERSION=$$(cat VERSION 2>/dev/null || echo 'unknown')
        SHORT_SHA="$${SHORT_SHA:-$${COMMIT_SHA:0:7}}"
        SHORT_SHA="$${SHORT_SHA:-local}"
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/rails8-blog:v$$APP_VERSION"

        echo "🚀 Deploying $$IMAGE to ${_APP_NAME}"
        echo "   Environment: ${_ENVIRONMENT}"

        gcloud run deploy "${_APP_NAME}" \
          --project "$PROJECT_ID" \
          --image "$$IMAGE" \
          --platform managed \
          --region "${_AR_REGION}" \
          --port 8080 \
          --memory "1Gi" \
          --add-cloudsql-instances="${_CLOUD_SQL_CONNECTION}" \
          --set-env-vars="RAILS_ENV=production" \
          --set-env-vars="RAILS_MASTER_KEY=${_RAILS_MASTER_KEY}" \
          --set-env-vars="DATABASE_URL=${_DATABASE_URL}" \
          --set-env-vars="RAILS_SERVE_STATIC_FILES=true" \
          --set-env-vars="RAILS_LOG_TO_STDOUT=yesplease" \
          --set-env-vars="APP_VERSION=$$APP_VERSION" \
          --set-env-vars="GIT_SHORT_SHA=$$SHORT_SHA" \
          --set-env-vars="RUBY_YJIT_ENABLE=true" \
          --set-env-vars="ENABLE_GCP=true" \
          --set-env-vars="ENABLE_SIGNUP=${_ENABLE_SIGNUP}" \
          --set-env-vars="ENVIRONMENT=${_ENVIRONMENT}" \
          --allow-unauthenticated

        echo "✅ Deployed to Cloud Run: ${_APP_NAME}"

